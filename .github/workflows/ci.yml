name: CI
on:
  pull_request:
    branches:
      - '*'

  push:
    branches:
      - '*'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

# Cancel superseded runs on PRs and branches. Runs on main are never cancelled, and event_name keeps
# the nightly schedule run in its own group so a push to main can't cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run Unit tests
        run: bundle exec rake spec:unit

      - name: Run Standard linter
        run: bundle exec standardrb

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [ 'mysql2', 'pg', 'sqlite3' ]
        ruby: ['3.3', '3.4', '4.0']
        rails: ['~> 7.2.0', '~> 8.0.0', '~> 8.1.0']

    env:
      DATABASE_ADAPTER: ${{ matrix.adapter }}
      RAILS_VERSION: ${{ matrix.rails }}

    # An empty image skips the service, so only the adapter under test gets a database container.
    services:
      mysql:
        image: ${{ matrix.adapter == 'mysql2' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: ${{ matrix.adapter == 'pg' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Configure Bundler
        run: bundle config set path 'vendor/bundle'
        working-directory: spec/dummyapp

      - name: Cache dummyapp dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spec/dummyapp/vendor/bundle
          key: dummyapp-${{ runner.os }}-ruby${{ matrix.ruby }}-${{ matrix.adapter }}-rails${{ matrix.rails }}-${{ hashFiles('spec/dummyapp/Gemfile', 'annotaterb.gemspec') }}

      - name: Install dummyapp dependencies (${{ matrix.adapter }}, Rails ${{ matrix.rails }})
        run: bundle install
        working-directory: spec/dummyapp

      - name: Run dummyapp migrations (${{ matrix.adapter }}, Rails ${{ matrix.rails }})
        run: bin/rails db:create
        working-directory: spec/dummyapp

      - name: Run Integration tests (${{ matrix.adapter }}, Rails ${{ matrix.rails }})
        run: bundle exec rake spec:integration
